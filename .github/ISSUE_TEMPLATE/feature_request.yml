name: Feature request
description: Suggest a concrete improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: Describe the creative workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
    validations:
      required: true
