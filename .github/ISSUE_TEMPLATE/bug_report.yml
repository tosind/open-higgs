name: Bug report
description: Report a reproducible studio or execution problem.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include expected behavior and the smallest set of steps.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - Studio interface
        - Local ComfyUI
        - Kaggle twin T4
        - WaveSpeed
        - Kie Market
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, app version, GPU, ComfyUI revision, and workflow ID when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, worker tokens, signed URLs and private media before posting.
      render: text
