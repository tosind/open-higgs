name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:studio
      - run: npm run format:check
      - run: python tests/worker_e2e.py
      - run: python scripts/verify_integrations.py
      - run: python scripts/check_publication.py
      - name: Install FFmpeg
        if: runner.os == 'Linux' && matrix.node == '24'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify picture and soundtrack rendering
        if: runner.os == 'Linux' && matrix.node == '24'
        run: python tests/render_e2e.py
